    <style>
        :root { --accent: #ff4500; --bg: #080808; --card-bg: #151515; }
        
        body { 
            background-color: var(--bg); color: white; 
            font-family: 'Roboto', sans-serif; margin: 0; padding: 0; 
            overflow-x: hidden;
        }

        /* Header */
        h2 { 
            color: var(--accent); text-align: center; font-family: 'Orbitron';
            font-size: 20px; padding: 25px 0 15px; margin: 0; letter-spacing: 2px;
        }

        /* Live Search */
        .search-wrap {
            position: sticky; top: 0; z-index: 500;
            background: var(--bg); padding: 10px 15px 12px;
        }
        .search-box {
            position: relative; max-width: 600px; margin: 0 auto;
        }
        .search-box i.fa-search {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: #777; font-size: 14px; pointer-events: none;
        }
        #search-input {
            width: 100%; box-sizing: border-box;
            background: var(--card-bg); color: #fff;
            border: 1px solid #2a2a2a; border-radius: 50px;
            padding: 13px 44px 13px 42px; font-size: 15px;
            font-family: 'Roboto', sans-serif; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 69, 0, 0.2);
        }
        #search-input::placeholder { color: #666; }
        #clear-search {
            display: none; position: absolute; right: 8px; top: 50%;
            transform: translateY(-50%); background: none; border: none;
            color: #999; font-size: 22px; cursor: pointer; padding: 4px 10px;
        }

        .status-msg {
            grid-column: 1 / -1; text-align: center; color: #777;
            padding: 40px 10px; font-size: 14px;
        }

        /* Movie Grid */
        .grid-container { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 15px; padding: 15px; 
        }
        
        .movie-card { 
            background: var(--card-bg); border-radius: 12px; 
            overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s; cursor: pointer;
        }
        .movie-card:active { transform: scale(0.95); }
        .movie-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        
        .movie-info { padding: 10px; }
        .movie-title { 
            font-size: 13px; font-weight: bold; margin-bottom: 5px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .rating { color: #ffb400; font-size: 11px; }

        /* Native Ad Styling */
        .native-ad-box {
            grid-column: 1 / -1; background: #111; padding: 15px;
            border-radius: 10px; text-align: center; border: 1px dashed #333;
        }

        /* --- PLAYER OVERLAY STYLE --- */
        #player-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 20000; overflow-y: auto;
        }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .download-btn {
            background: #27ae60; color: white; padding: 14px; border-radius: 8px;
            text-decoration: none; font-weight: bold; display: block; 
            text-align: center; margin: 20px; border: 1px solid #2ecc71;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
        }

/* Floating Back Button [cite: 2026-01-31] */
.back-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: var(--accent);
    color: white;
    padding: 12px 20px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
    z-index: 1000;
    transition: 0.3s;
}
.back-btn:active { transform: scale(0.9); }

/* Footer Styling [cite: 2026-01-31] */
footer {
    text-align: center;
    padding: 40px 20px 100px; /* Extra padding sa ubos para dle matabunan sa button */
    border-top: 1px solid #1a1a1a;
    margin-top: 30px;
}
footer p {
    font-size: 12px;
    color: #555;
    letter-spacing: 1px;
}
footer span {
    color: var(--accent);
    font-weight: bold;
}

    </style>

    <script>
    const apiKey = '3455ebd9bf16f0b30d2ed31128bf933c';
    const trendingUrl = `https://api.themoviedb.org/3/trending/movie/day?api_key=${apiKey}&region=US`;
    const searchUrl = (q) => `https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(q)}&include_adult=false`;

    const grid = document.getElementById('movie-grid');
    const input = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-search');
    const pageTitle = document.getElementById('page-title');

    let requestId = 0;     // para ignore-on ang old results kung paspas ang type
    let debounceTimer = null;

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function showMessage(text) {
        grid.innerHTML = `<div class="status-msg">${text}</div>`;
    }

    function renderMovies(movies, withAd) {
        grid.innerHTML = '';

        movies.forEach((movie, index) => {
            // 1. Movie Card Logic
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.onclick = () => playMovie(movie.id);
            const title = escapeHtml(movie.title || 'Untitled');
            const rating = (movie.vote_average || 0).toFixed(1);
            card.innerHTML = `
                <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${title}" loading="lazy">
                <div class="movie-info">
                    <div class="movie-title">${title}</div>
                    <div class="rating">⭐ ${rating}</div>
                </div>
            `;
            grid.appendChild(card);

            // 2. Insert Native Banner at index 4 (trending lang, dili sa search)
            if (withAd && index === 4) {
                const adDiv = document.createElement('div');
                adDiv.className = 'native-ad-box';
                adDiv.innerHTML = `
                    <p style="color: #666; font-size: 10px; margin-bottom: 8px;">Recommended for You</p>
                    <div id="container-1ebaa3930d67bc4f175aaf45aeba75dd"></div>
                `;
                grid.appendChild(adDiv);

                const script = document.createElement('script');
                script.async = "async";
                script.dataset.cfasync = "false";
                script.src = "https://pl28733694.effectivegatecpm.com/1ebaa3930d67bc4f175aaf45aeba75dd/invoke.js";
                adDiv.appendChild(script);
            }
        });
    }

    async function fetchMovies() {
        const myId = ++requestId;
        try {
            const response = await fetch(trendingUrl);
            const data = await response.json();
            if (myId !== requestId) return; // naay mas bag-ong request na
            pageTitle.textContent = '🔥 GLOBAL TRENDING';
            renderMovies(data.results.filter(m => m.poster_path).slice(0, 12), true);
        } catch (error) { 
            console.error("Error fetching movies:", error);
            if (myId === requestId) showMessage('Error loading movies. Try again.');
        }
    }

    async function searchMovies(query) {
        const myId = ++requestId;
        showMessage('Searching...');
        try {
            const response = await fetch(searchUrl(query));
            const data = await response.json();
            if (myId !== requestId) return; // naay mas bag-ong request na
            const results = (data.results || []).filter(m => m.poster_path).slice(0, 20);
            pageTitle.textContent = '🔍 SEARCH RESULTS';
            if (results.length === 0) {
                showMessage(`Walay nakita para sa "${escapeHtml(query)}"`);
            } else {
                renderMovies(results, false);
            }
        } catch (error) {
            console.error("Error searching movies:", error);
            if (myId === requestId) showMessage('Error sa search. Try again.');
        }
    }

    // Live search: mo-search 400ms human ka mo-undang ug type
    input.addEventListener('input', () => {
        const query = input.value.trim();
        clearBtn.style.display = input.value ? 'block' : 'none';
        clearTimeout(debounceTimer);

        if (!query) {
            fetchMovies(); // balik sa trending
            return;
        }
        debounceTimer = setTimeout(() => searchMovies(query), 400);
    });

    clearBtn.addEventListener('click', () => {
        input.value = '';
        clearBtn.style.display = 'none';
        clearTimeout(debounceTimer);
        fetchMovies();
        input.focus();
    });

    function playMovie(id) {
    const overlay = document.getElementById('player-overlay');
    const iframe = document.getElementById('video-iframe');

    if (iframe) {
        iframe.src = `https://vidsrc.me/embed/movie?tmdb=${id}`;
    }

    if (overlay) {
        overlay.style.display = 'block';
        document.body.style.overflow = 'hidden';
    }
}

function closePlayer() {
    const overlay = document.getElementById('player-overlay');
    const iframe = document.getElementById('video-iframe');

    if (overlay) overlay.style.display = 'none';
    if (iframe) iframe.src = '';

    document.body.style.overflow = 'auto';
}

    // KINI ANG IMPORTANTE: Kinahanglan i-trigger ang function inig load sa page!
    document.addEventListener('DOMContentLoaded', fetchMovies);
</script>
